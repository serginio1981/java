appId: cl.bingomaster.app
productName: BingoMaster
copyright: BingoMaster
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: BingoMaster-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: BingoMaster
  # Los datos (bingomaster.db) viven en %APPDATA%\BingoMaster y NO se borran al desinstalar.
  deleteAppDataOnUninstall: false
publish: null
